name: Common and Firmware Host Tests

on:
  push:
    paths:
      - 'common/**'
      - 'firmware/**'
      - 'python/imu/**'
      - '.github/workflows/c-cpp.yml'
  pull_request:
    paths:
      - 'common/**'
      - 'firmware/**'
      - 'python/imu/**'
      - '.github/workflows/c-cpp.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Tell all steps to run inside the 'common' directory
    defaults:
      run:
        working-directory: ./common

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      # -B build: Create a build folder
      # -DBUILD_TESTING=ON: Activate the testing block in your CMakeLists
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

    - name: Build
      # Build the project inside the 'build' folder
      run: cmake --build build

    - name: Test
      # Run the tests defined by add_test()
      # --output-on-failure: Prints the error log if a test fails
      run: ctest --test-dir build --output-on-failure

    - name: Configure Firmware Host Tests
      working-directory: .
      run: cmake -S firmware/tests -B firmware/tests/build

    - name: Build Firmware Host Tests
      working-directory: .
      run: cmake --build firmware/tests/build

    - name: Run Firmware Host Tests
      working-directory: .
      run: ctest --test-dir firmware/tests/build --output-on-failure

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install IMU Python Client
      working-directory: .
      run: python -m pip install ./python/imu

    - name: Test IMU Python Client and Firmware Format
      working-directory: .
      env:
        IMU_PROTOCOL_TEST_EXECUTABLE: ${{ github.workspace }}/firmware/tests/build/imu_protocol_tests
      run: python -m unittest discover -s python/imu/tests -v
